name: Execute Instruction

on:
  push:
    paths:
      - 'commands/incoming/**'

jobs:
  process-command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run apply_changes controller
        env:
          MONO_REPO_TOKEN: ${{ secrets.MONO_REPO_TOKEN }}
          MONO_REPO_FULL_NAME: Affynix-LLC/mono-repo-master
        run: |
          python scripts/apply_changes.py

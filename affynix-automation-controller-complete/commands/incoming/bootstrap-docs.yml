title: "Bootstrap README and contributing guide"
body: |
  This PR establishes baseline documentation for the Affynix monorepo.
  
  - Adds README.md with project overview
  - Adds CONTRIBUTING.md with contribution guidelines
  
  Generated by affynix-automation controller.

base_branch: main
branch_name: feature/bootstrap-docs

changes:
  - path: "README.md"
    mode: overwrite
    content: |
      # Affynix Mono Repo
      
      Central hub for Affynix LLC infrastructure and services.
      
      ## Projects
      
      - **0xVoice** - AI voice synthesis and processing
      - **0xAPI** - Protocol automation and API layer
      - **Pornstar.ai** - Specialized media platform
      
      ## Getting Started
      
      See [CONTRIBUTING.md](CONTRIBUTING.md) for development setup.
      
      ## License
      
      Proprietary © Affynix LLC
      
  - path: "CONTRIBUTING.md"
    mode: overwrite
    content: |
      # Contributing to Affynix
      
      ## Setup
      
      1. Clone the repository
      2. Install dependencies
      3. Create a feature branch
      
      ## Workflow
      
      - Create PRs for all changes
      - Ensure tests pass before merge
      - Follow existing code style
      
      ## Questions?
      
      Reach out to the dev team.

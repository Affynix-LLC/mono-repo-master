name: Execute Instruction

on:
  push:
    paths:
      - 'affynix-automation-controller-complete/commands/incoming/**'
      - 'affynix-automation-controller-complete/atlas/toggle_state.json'
  workflow_dispatch:

jobs:
  process-command:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: affynix-automation-controller-complete

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run apply_changes controller
        env:
          MONO_REPO_TOKEN_PRIMARY: ${{ secrets.MONO_REPO_TOKEN }}
          MONO_REPO_TOKEN_FALLBACK: ${{ secrets.MONO_REPO__MASTER_TOKEN }}
          MONO_REPO_FULL_NAME: ${{ secrets.MONO_REPO_FULL_NAME }}
        run: |
          TOKEN="${MONO_REPO_TOKEN_PRIMARY:-}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${MONO_REPO_TOKEN_FALLBACK:-}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: MONO_REPO_TOKEN is not set (checked MONO_REPO_TOKEN and MONO_REPO__MASTER_TOKEN secrets)." >&2
            exit 1
          fi
          MONO_REPO_TOKEN="$TOKEN" python scripts/apply_changes.py

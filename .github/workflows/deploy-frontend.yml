name: Deploy Frontend to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'affynix_com_website/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  NODE_VERSION: '18.x'

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: affynix_com_website
        run: npm ci

      - name: Build frontend
        working-directory: affynix_com_website
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        working-directory: affynix_com_website
        run: |
          echo "Deploying frontend to Vercel..."

          # Validate VERCEL_TOKEN
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ ERROR: VERCEL_TOKEN secret is not set!"
            echo "Please add your Vercel token to GitHub Secrets"
            exit 1
          fi

          # Deploy to production
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            FRONTEND_URL=$(vercel --prod --token=$VERCEL_TOKEN --yes)
          else
            FRONTEND_URL=$(vercel --prod --token=$VERCEL_TOKEN --yes)
          fi

          echo "url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend deployed to: $FRONTEND_URL"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to be ready..."
          FRONTEND_URL="${{ steps.deploy.outputs.url }}"

          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "$FRONTEND_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || \
               [ "$HTTP_CODE" = "301" ] || \
               [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Frontend is ready! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/20: Not ready (HTTP $HTTP_CODE), wait 10s..."
            sleep 10
          done

          echo "⚠️  Frontend did not respond after 3 minutes"
          echo "Check Vercel dashboard for deployment status"
          exit 1

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Frontend Deployment Summary" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Frontend (Vercel)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ **Status:** Deployed Successfully" \
              >> $GITHUB_STEP_SUMMARY
            URL="${{ needs.deploy-frontend.outputs.frontend_url }}"
            echo "🔗 **URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment Failed" \
              >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Common Issues:**" >> $GITHUB_STEP_SUMMARY
            echo "1. VERCEL_TOKEN not set in Secrets" \
              >> $GITHUB_STEP_SUMMARY
            echo "2. Build failures - check logs" \
              >> $GITHUB_STEP_SUMMARY
            echo "3. Missing dependencies - check package.json" \
              >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit the frontend at the URL above" \
            >> $GITHUB_STEP_SUMMARY
          echo "2. Test subdomain routing (e.g., client.affynix.com)" \
            >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor Vercel dashboard for logs" \
            >> $GITHUB_STEP_SUMMARY

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product-card { 
            border: 1px solid #ccc; 
            padding: 20px; 
            margin: 10px; 
            cursor: pointer;
            border-radius: 8px;
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 1000;
        }
        .modal-content { 
            background: white; 
            margin: 50px auto; 
            padding: 20px; 
            width: 80%; 
            max-width: 500px; 
            border-radius: 8px;
        }
        .close { 
            float: right; 
            font-size: 24px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <h1>Modal Test</h1>
    
    <div class="product-card" onclick="openModal()">
        <h3>Test Product</h3>
        <p>Click to test modal</p>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Test Modal</h2>
            <p>This is a test modal to verify functionality.</p>
            <a href="https://hop.clickbank.net/?vendor=test&affiliate=affynix" target="_blank">
                Test ClickBank Link
            </a>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('modal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>

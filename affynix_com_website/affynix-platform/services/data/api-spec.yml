# AFFYNIX DATA SERVICE API
# GraphQL-first with REST fallback
# Real-time subscriptions for analytics

schema:
  types:
    Product:
      id: ID!
      slug: String!
      name: String!
      description: String!
      price: Float!
      recurring: Boolean!
      recurringPeriod: String
      
      # Categorization
      # Categorization
      domain: String!
      category: String!
      tags: [String!]

      # Media
      images: [String!]
      videoUrl: String
      audioUrl: String
      
      # Specifications
      features: [String!]
      skillLevel: String!
      timeInvestment: String!
      platform: String!
      
      # Affiliate
      affiliateLink: String!
      affiliateNetwork: String!
      commission: Float
      
      # Metadata
      createdAt: DateTime!
      updatedAt: DateTime!
      publishedAt: DateTime
      status: ProductStatus!
      
      # Analytics
      views: Int!
      clicks: Int!
      conversionRate: Float
    
    SubdomainLease:
      id: ID!
      subdomain: String!
      customerId: ID!
      status: LeaseStatus!
      tier: String!
      
      # Billing
      monthlyRate: Float!
      stripeSubscriptionId: String
      expiresAt: DateTime!
      autoRenew: Boolean!
      
      # Configuration
      primaryService: String!
      config: JSON!
      
      # Analytics
      emailsReceived: Int!
      storageUsed: BigInt!
      apiCalls: Int!
    
    AnalyticsSnapshot:
      domain: String!
      period: DateRange!
      
      # Traffic
      pageViews: Int!
      uniqueVisitors: Int!
      bounceRate: Float!
      avgSessionDuration: Int!
      
      # Conversion
      modalOpens: Int!
      modalDetailsExpanded: Int!
      clickThroughs: Int!
      conversionRate: Float!
      
      # SEO
      organicTraffic: Int!
      searchImpressions: Int!
      avgPosition: Float!
      backlinks: Int!
      domainAuthority: Int!
      
      # Revenue
      clicks: Int!
      estimatedRevenue: Float!
    
    # Queries
    Query:
      # Products
      products:
        domain: String
        category: String
        search: String
        limit: Int = 50
        offset: Int = 0
        returns: [Product!]
      
      product:
        id: ID
        slug: String
        returns: Product
      
      # Subdomains
      subdomainLeases:
        status: LeaseStatus
        tier: String
        limit: Int = 100
        returns: [SubdomainLease!]
      
      subdomainLease:
        id: ID
        subdomain: String
        returns: SubdomainLease
      
      # Analytics
      analytics:
        domain: String!
        period: DateRange!
        granularity: Granularity = DAILY
        returns: [AnalyticsSnapshot!]
      
      # SEO Network
      seoNetwork:
        returns: SEONetworkMetrics!
      
      crossDomainTraffic:
        from: String!
        to: String!
        returns: Int!
    
    # Mutations
    Mutation:
      # Products
      createProduct:
        input: ProductInput!
        returns: Product!
      
      updateProduct:
        id: ID!
        input: ProductInput!
        returns: Product!
      
      deleteProduct:
        id: ID!
        returns: Boolean!
      
      # Subdomains
      registerSubdomain:
        input: SubdomainInput!
        returns: SubdomainLease!
      
      updateSubdomainConfig:
        id: ID!
        config: JSON!
        returns: SubdomainLease!
      
      cancelSubdomain:
        id: ID!
        returns: Boolean!
      
      # Analytics
      trackEvent:
        event: EventInput!
        returns: Boolean!
    
    # Subscriptions (WebSocket)
    Subscription:
      analyticsStream:
        domain: String!
        returns: AnalyticsSnapshot!
      
      conversionEvents:
        domain: String!
        returns: ConversionEvent!
    
    # Enums
    ProductStatus:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
    
    LeaseStatus:
      - PENDING
      - ACTIVE
      - SUSPENDED
      - EXPIRED
    
    Granularity:
      - HOURLY
      - DAILY
      - WEEKLY
      - MONTHLY

# REST API Endpoints (for compatibility)
rest:
  "/api/v1/products":
    GET: "List products with filters"
    POST: "Create new product"
  
  "/api/v1/products/:id":
    GET: "Get product by ID"
    PUT: "Update product"
    DELETE: "Delete product"
  
  "/api/v1/subdomains":
    GET: "List subdomain leases"
    POST: "Register new subdomain"
  
  "/api/v1/analytics/:domain":
    GET: "Get analytics for domain"
  
  "/api/v1/seo/network":
    GET: "Get SEO network metrics"

# Rate Limits
rateLimits:
  authenticated:
    window: "15m"
    max: 1000
  
  anonymous:
    window: "15m"
    max: 100
  
  api_key:
    window: "1h"
    max: 10000
name: affynix-ai-stack

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: affynix-backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/affynix.db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: affynix-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4173 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: affynix-admin
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

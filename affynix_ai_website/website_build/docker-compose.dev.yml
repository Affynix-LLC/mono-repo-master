name: affynix-ai-stack-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: affynix-backend-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
    command: ["npm", "run", "dev"]
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: affynix-frontend-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "1"
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0",
        "--port",
        "${FRONTEND_PORT:-4173}"
      ]
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  backend_node_modules:
  frontend_node_modules:


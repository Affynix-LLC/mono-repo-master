services:
  intake-api:
    build:
      context: ./intake-api
      dockerfile: Dockerfile
    container_name: affynix-intake-api
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - AFFYNIX_SCRAPER_KEY=${AFFYNIX_SCRAPER_KEY:-1b9fdfac2e5e1180a450be225c38950d965cf681680a01c6119f98e729081603}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY:-patwU6DAjkobXeSizAir}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID:-apprtDMPpjmYejxA3}
      - AIRTABLE_TABLE_OFFERS=${AIRTABLE_TABLE_OFFERS:-Offers}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}
      - AFFYNIX_TARGET_CNAME=${AFFYNIX_TARGET_CNAME:-cname.vercel-dns.com}
      - VERCEL_API_TOKEN=${VERCEL_API_TOKEN}
      - VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID}
      - VERCEL_TEAM_ID=${VERCEL_TEAM_ID}
    restart: unless-stopped
    networks:
      - affynix-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  scraper:
    build:
      context: ./affynix-harvester/scraper
      dockerfile: Dockerfile
    container_name: affynix-scraper
    depends_on:
      intake-api:
        condition: service_healthy
    environment:
      - AFFYNIX_INTAKE_URL=http://intake-api:3003/api/scraper-intake
      - AFFYNIX_SCRAPER_KEY=${AFFYNIX_SCRAPER_KEY:-1b9fdfac2e5e1180a450be225c38950d965cf681680a01c6119f98e729081603}
    volumes:
      - ./affynix-harvester/scraper/logs:/usr/src/app/logs
      - ./affynix-harvester/scraper/sessions:/usr/src/app/sessions
    restart: unless-stopped
    networks:
      - affynix-network

networks:
  affynix-network:
    driver: bridge

